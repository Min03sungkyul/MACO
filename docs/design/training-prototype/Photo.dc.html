<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>샘플 메뉴 사진</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100%; min-height: 60px; background: #eadfd0; overflow: hidden">
<svg viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="{{ alt }}" style="display: block">
  <defs><filter id="macoBlur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.2"></feGaussianBlur></filter></defs>
  <g filter="{{ filter }}">
  <rect width="320" height="240" fill="#eadfd0"></rect>
  <rect x="22" y="18" width="78" height="96" rx="4" fill="#f7f2ea"></rect>
  <rect x="59" y="18" width="4" height="96" fill="#e3d7c6"></rect>
  <rect x="22" y="64" width="78" height="4" fill="#e3d7c6"></rect>
  <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
    <rect x="118" y="62" width="150" height="7" rx="2" fill="#9c7b57"></rect>
    <rect x="128" y="34" width="20" height="28" rx="3" fill="#c98b4f"></rect>
    <rect x="154" y="40" width="18" height="22" rx="3" fill="#6f8f6a"></rect>
    <rect x="178" y="30" width="24" height="32" rx="3" fill="#d9c27a"></rect>
    <rect x="208" y="42" width="16" height="20" rx="3" fill="#b8574a"></rect>
    <rect x="230" y="36" width="26" height="26" rx="3" fill="#5f7fa8"></rect>
  </sc-if>
  <rect y="150" width="320" height="90" fill="#c9a982"></rect>
  <rect y="150" width="320" height="6" fill="#b8966c"></rect>
  <sc-if value="{{ clutter }}" hint-placeholder-val="{{ false }}">
    <g transform="rotate(9 252 104)"><rect x="234" y="58" width="38" height="86" rx="2" fill="#ffffff"></rect><rect x="240" y="70" width="26" height="3" fill="#c9c9c9"></rect><rect x="240" y="80" width="20" height="3" fill="#c9c9c9"></rect><rect x="240" y="90" width="24" height="3" fill="#c9c9c9"></rect><rect x="240" y="100" width="16" height="3" fill="#c9c9c9"></rect><rect x="240" y="118" width="26" height="5" fill="#9b9b9b"></rect></g>
    <rect x="198" y="104" width="34" height="42" rx="5" fill="#ffffff" stroke="#d8d0c4" stroke-width="2"></rect>
    <ellipse cx="215" cy="106" rx="17" ry="5" fill="#7a4e2d"></ellipse>
    <path d="M232 114c9 0 9 18 0 18" fill="none" stroke="#d8d0c4" stroke-width="4"></path>
    <path d="M268 92 L300 92 L295 148 L273 148 Z" fill="#f3f3f3" stroke="#d0d0d0" stroke-width="2"></path>
    <rect x="265" y="84" width="38" height="10" rx="3" fill="#2f2f2f"></rect>
  </sc-if>
  <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
    <rect x="30" y="196" width="66" height="34" rx="6" fill="#262626" transform="rotate(-8 63 213)"></rect>
    <rect x="120" y="168" width="44" height="54" rx="4" fill="#ffffff" stroke="#d8d0c4" stroke-width="2"></rect>
    <rect x="128" y="160" width="28" height="12" rx="2" fill="#f2ede4"></rect>
  </sc-if>
  <g transform="{{ cakeTransform }}">
    <ellipse cx="160" cy="194" rx="94" ry="22" fill="#fbf8f3" stroke="#e6dccd" stroke-width="2"></ellipse>
    <path d="M90 188 L230 188 L217 146 L103 146 Z" fill="#e9c99e"></path>
    <rect x="96" y="166" width="128" height="6" fill="#f7ebd6"></rect>
    <path d="M103 146 L217 146 L212 132 L108 132 Z" fill="#faf3e6"></path>
    <circle cx="130" cy="126" r="15" fill="#7e3354"></circle><circle cx="130" cy="126" r="8" fill="#c76a8c"></circle>
    <circle cx="160" cy="122" r="16" fill="#7e3354"></circle><circle cx="160" cy="122" r="9" fill="#c76a8c"></circle>
    <circle cx="190" cy="126" r="15" fill="#7e3354"></circle><circle cx="190" cy="126" r="8" fill="#c76a8c"></circle>
    <path d="M166 108q11-15 24-8q-9 13-24 8z" fill="#4c8c4a"></path>
  </g>
  </g>
  <sc-if value="{{ interior }}" hint-placeholder-val="{{ false }}">
    <rect width="320" height="240" fill="#efe6da"></rect>
    <rect x="18" y="16" width="128" height="118" rx="6" fill="#fbf7f0" stroke="#d9cbb8" stroke-width="3"></rect>
    <path d="M82 16v118M18 74h128" stroke="#d9cbb8" stroke-width="3"></path>
    <path d="M196 0v36M268 0v36" stroke="#6b5a46" stroke-width="2"></path>
    <path d="M184 36h24l-4 12h-16zM256 36h24l-4 12h-16z" fill="#3d3328"></path>
    <circle cx="196" cy="50" r="4" fill="#ffd58a"></circle><circle cx="268" cy="50" r="4" fill="#ffd58a"></circle>
    <rect y="160" width="320" height="80" fill="#c9a982"></rect>
    <rect x="40" y="138" width="86" height="10" rx="3" fill="#8a6a4a"></rect><rect x="78" y="148" width="8" height="44" fill="#8a6a4a"></rect>
    <rect x="18" y="150" width="22" height="40" rx="5" fill="#5f7a5a"></rect><rect x="126" y="150" width="22" height="40" rx="5" fill="#5f7a5a"></rect>
    <rect x="180" y="132" width="104" height="10" rx="3" fill="#8a6a4a"></rect><rect x="228" y="142" width="8" height="50" fill="#8a6a4a"></rect>
    <rect x="160" y="146" width="22" height="44" rx="5" fill="#b8574a"></rect><rect x="284" y="146" width="22" height="44" rx="5" fill="#b8574a"></rect>
    <ellipse cx="214" cy="128" rx="12" ry="4" fill="#fbf8f3"></ellipse><rect x="244" y="118" width="14" height="14" rx="3" fill="#ffffff"></rect>
    <path d="M296 120q-14-30 4-52q10 24-4 52z" fill="#4c8c4a"></path><rect x="290" y="118" width="16" height="20" rx="3" fill="#c98b4f"></rect>
  </sc-if>
  <sc-if value="{{ dark }}" hint-placeholder-val="{{ false }}">
    <rect width="320" height="240" fill="#16120e" opacity="0.58"></rect>
  </sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["clean","busy","spot","dark","blur","interior"],"default":"clean"},"$preview":{"width":320,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    var kind = this.props.kind || 'clean';
    var T = {
      clean: 'translate(-48,-52) scale(1.3)',
      dark: 'translate(-48,-52) scale(1.3)',
      busy: 'translate(196,124) scale(0.42)',
      spot: 'translate(-6,8) scale(0.82)',
      blur: 'translate(-48,-52) scale(1.3)',
      interior: 'translate(-48,-52) scale(1.3)'
    };
    var ALT = {
      clean: '무화과 케이크가 가운데에 크게 보이는 밝은 사진',
      dark: '무화과 케이크가 크게 보이지만 조명이 어두운 사진',
      busy: '케이크가 오른쪽 아래에 작게 있고 선반·컵·영수증이 많이 보이는 사진',
      spot: '케이크 오른쪽 위에 컵과 영수증이 놓인 사진',
      blur: '무화과 케이크가 크게 보이지만 흔들려서 흐린 사진',
      interior: '창가 자리와 테이블, 조명이 보이는 밝은 매장 사진'
    };
    return {
      cakeTransform: T[kind] || T.clean,
      busy: kind === 'busy',
      clutter: kind === 'busy' || kind === 'spot',
      dark: kind === 'dark',
      interior: kind === 'interior',
      filter: kind === 'blur' ? 'url(#macoBlur)' : 'none',
      alt: ALT[kind] || ALT.clean
    };
  }
}
</script>
</body>
</html>
