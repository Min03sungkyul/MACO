# 로컬 개발용 MySQL. 비밀번호는 로컬 전용 값이다 (배포용은 docker-compose.prod.yml 에 따로).
services:
  mysql:
    image: mysql:8.4
    container_name: maco-mysql
    environment:
      MYSQL_DATABASE: maco
      MYSQL_USER: maco
      MYSQL_PASSWORD: maco_local
      MYSQL_ROOT_PASSWORD: root_local
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # 접속을 받을 준비가 됐는지 확인 → `docker compose up -d --wait`가 준비될 때까지 기다린다
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umaco", "-pmaco_local", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  mysql-data:
